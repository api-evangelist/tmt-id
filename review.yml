aid: tmt-id
name: TMT ID
review:
  question: >-
    Does TMT ID publish a real, self-serve public developer surface with downloadable
    OpenAPI, and what is its CAMARA / GSMA Open Gateway posture?
  answer: true
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
findings:
  summary: |
    TMT ID (TMT Analysis Limited, 33 Queen St, London EC4R 1BR, with offices in
    Ploiesti, Romania and Wilmington, Delaware) is a mobile number intelligence and
    anti-fraud data aggregator, not a carrier. Founded 2017 as TMT Analysis, acquired
    Phronesis Technologies in 2023, rebranded TMT ID in 2024.

    The developer surface is REAL and OPEN, which puts TMT ID on the API-native side of
    the telecom split rather than the partner-gated carrier side. https://tmtid.com/developers/
    returns HTTP 200 with no login and links seven product reference pages, each of which
    is a ReDoc-rendered OpenAPI 3.0 document served as static HTML at
    https://tmtid.com/developer/<product>.html (all seven returned HTTP 200 on
    2026-07-25). The Viteza portal at https://viteza.tmtanalysis.com/register (HTTP 200)
    offers self-serve signup with 500 free queries against Live, Velocity and TeleShield.

    The one honest qualification: the documentation is ungated, but production API keys
    and secrets are described in the specs as "provided to you during the onboarding
    process" — read, try in the portal, but talk to sales for production credentials.
    There is no instant API-key issuance from the docs and no public sandbox host.
  developerPortal:
    url: https://tmtid.com/developers/
    httpStatus: 200
    kind: real self-serve documentation hub
    loginWall: false
    note: >-
      Public, no login, links every product API reference. A separate self-serve
      transactional portal (Viteza) exists at https://viteza.tmtanalysis.com/register
      (HTTP 200) with 500 free queries on signup.
    gated: false
    gatedQualifier: >-
      Docs and portal signup are open; production API credentials are issued through a
      commercial onboarding conversation, not generated from the docs.
