                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasDeviceChanged:
              oneOf:
              - additionalProperties: false
                title: Successful hasDeviceChanged response
                properties:
                  changedInTimePeriod:
                    type: boolean
                    example: false
                    description: Has a change taken place in the specified time
                  lastChange:
                    type:
                    - string
                    - 'null'
                    example: null
                    format: date-time
                    description: The time of last known device change in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                required:
                - changedInTimePeriod
                - lastChange
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            wasReportedLostOrStolen:
              oneOf:
              - additionalProperties: false
                title: Successful wasReportedLostOrStolen response
                properties:
                  inPeriod:
                    type:
                    - boolean
                    - 'null'
                    example: true
                    description: Has been reported for lost or stolen in the specified time
                  isDataAvailable:
                    type: boolean
                    example: true
                  isLostOrStolen:
                    type:
                    - boolean
                    - 'null'
                    example: true
                  lostOrStolenDate:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    example: '2023-02-12T17:42:14+00:00'
                    description: some description
                required:
                - inPeriod
                - isDataAvailable
                - isLostOrStolen
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasAccountTenure:
              oneOf:
              - additionalProperties: false
                title: Successful hasAccountTenure response
                properties:
                  longerThanPeriod:
                    type:
                    - boolean
                    - 'null'
                    example: false
