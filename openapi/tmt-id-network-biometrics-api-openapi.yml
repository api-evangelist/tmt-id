                  isDataAvailable:
                    type: boolean
                    example: true
                required:
                - longerThanPeriod
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasContractInfo:
              oneOf:
              - additionalProperties: false
                title: Successful hasContractInfo response
                properties:
                  startDate:
                    type:
                    - string
                    - 'null'
