                      reason:
                        type:
                        - string
                        - 'null'
                        example: found
                        description: The reason given for the removal from the blacklist
                  history:
                    type:
                    - object
                    - 'null'
                    required:
                    - blacklistedCount
                    - removedCount
                    - operators
                    properties:
                      blacklistedCount:
                        type:
                        - integer
                        - 'null'
                        example: 10
                        description: Number of times device has been blacklisted
                      removedCount:
                        type:
                        - integer
                        - 'null'
                        example: 2
                        description: Number of times the device has been removed from the GSMA blacklist
                      operators:
                        type:
                        - integer
                        - 'null'
                        example: 2
                        description: Number of unique operators or other parties who have blacklisted the device
                required:
                - inPeriod
                - blacklistStatus
                - isDataAvailable
                - blacklistEvent
                - removeEvent
                - history
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
      required:
      - protect
    DiscoverProductResponse:
      title: Discover Product Response
      type: object
      description: 'Schema of a successful response for Discover features.

        Note: the discover.device.blacklist syntax has subtle differences from protect.wasBlacklisted, these are distinct products with different use cases."'
      additionalProperties: false
      example:
        discover:
          number:
            is: '447700900501'
            isCorrectFormat: true
            isValid: true
            country:
              name: United Kingdom of Great Britain and Northern Ireland
              code: GB
              dialCode: '44'
            onNetwork:
              MCC: '001'
              MNC: '04'
              networkName: Phronesis (H3G UK)
            isPorted: false
          hasNumberBeenRecycled:
            isRecycled: true
            changedInTimePeriod: true
            lastChange: '2022-10-20T11:36:26+00:00'
          hasMVNOInfo:
            isMVNO: true
            brand: iD mobile
            isDataAvailable: true
          hasHomeNetworkInfo:
            isRoaming: true
            isDataAvailable: true
          device:
            IMEI:
              is: '969455279101647'
            serialNo:
              value: DX3ZJ7LRKXK7
              isDataAvailable: true
            model:
              brand: Apple
              name: iPhone XR
              code: iPhone XR (A2105)
              isDataAvailable: true
            activation:
              isActivated: true
              isDataAvailable: true
              date: null
            estimatedPurchase:
              date: '2020-01-28'
              isDataAvailable: true
            blacklist:
              status: true
              isDataAvailable: true
              addEvent:
                date: '2023-01-24 08:32:08'
                by: Hutchison 3G UK
                reason: Stolen Or Lost
              removeEvent:
                date: '2023-01-24 15:32:08'
                by: Hutchison 3G UK
                reason: Found
              history:
                blacklistedCount: 30
                removedCount: 29
                operators: 2
            retail:
              currency: USD
              prices:
              - '1247'
              - '1366'
              - '1604'
              - '1842'
              storageOptions:
              - 128 GB
              - 256 GB
              - 512 GB
              - 1 TB
              releaseDate: '2021-09-01'
              isDataAvailable: true
        transaction:
          status:
            value: 0
            message: transaction successful
          reference: https://developer.api.v3.phronesis.tech/
          id: b196fe72-49f7-4888-abc2-66bc14b5ca3f
      properties:
        discover:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            number:
              type: object
              additionalProperties: false
              properties:
                is:
                  type: string
                  example: '447700900501'
                  description: Echoes the input number in [E.164](https://en.wikipedia.org/wiki/E.164) format
                isCorrectFormat:
                  type: boolean
                  description: Indicates if the subscriber's number is in correct format (true) or not (false)
                  example: true
                isValid:
                  type: boolean
                  description: Indicates if the subscriber's number is valid (true) or not (false)
                  example: true
                country:
                  type: object
                  description: Country the subscriber is registered in
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      description: Name of the country the subscriber is registered in
                      example: United Kingdom of Great Britain and Northern Ireland
                    code:
                      type: string
                      description: '[ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) code for the country the subscriber is registered in'
                      example: GB
                    dialCode:
                      type: string
                      description: Dial code for the country of registration
                      example: '44'
                  required:
                  - name
                  - code
                  - dialCode
                onNetwork:
                  type: object
                  description: Subscriber network information
                  additionalProperties: false
                  properties:
                    MCC:
                      type: string
                      description: The subscriber's [mobile country code](https://en.wikipedia.org/wiki/Mobile_country_code)
                      example: '234'
                    MNC:
                      type: string
                      description: The subscriber's [mobile network code](https://en.wikipedia.org/wiki/Mobile_country_code)
                      example: '30'
                    networkName:
                      type: string
                      description: The current network operator for the subscriber
                      example: EE UK
                  required:
                  - MCC
                  - MNC
                  - networkName
                isPorted:
                  type: boolean
                  description: "A true value indicates that a number is no longer served by the original number range owner or   \nhas been ported since this allocation where data is available to determine this from the mobile operators"
                  example: true
                wasOnNetwork:
                  type: object
                  description: Previous network, if ported
                  additionalProperties: false
                  properties:
                    MCC:
                      type: string
                      description: The prior [mobile country code](https://en.wikipedia.org/wiki/Mobile_country_code) of the MSISDN
                      example: '234'
                    MNC:
                      type: string
                      description: The prior [mobile network code](https://en.wikipedia.org/wiki/Mobile_country_code)
                      example: '15'
                    networkName:
                      type: string
                      description: The prior network operator of the MSISDN
                      example: Vodafone UK
                  required:
                  - MCC
                  - MNC
                  - networkName
            hasNumberBeenRecycled:
              oneOf:
              - additionalProperties: false
                title: Successful hasNumberBeenRecycled response
                properties:
                  isRecycled:
                    type: boolean
                    description: Indicates if the number been recycled
                    example: true
                  changedInTimePeriod:
                    type: boolean
                    description: Indicates if the state has changed in the requested time period
                    example: false
                  lastChange:
                    type:
                    - string
                    - 'null'
                    description: Date of last change, if known
                    example: '2020-03-28T13:07:12Z'
                    format: date-time
                required:
                - isRecycled
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasMVNOInfo:
              oneOf:
              - additionalProperties: false
                title: Successful hasMVNOInfo response
                properties:
                  isMVNO:
                    type:
                    - boolean
                    - 'null'
                    description: Indicates if the number is allocated to a virtual mobile network (MVNO) or not
                    example: true
                  brand:
                    type:
                    - string
                    - 'null'
                    description: The (virtual) network brand, if available
                    example: iD mobile
                  isDataAvailable:
                    type: boolean
                    example: true
                required:
                - isMVNO
                - brand
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasHomeNetworkInfo:
              oneOf:
              - type: object
                additionalProperties: false
                properties:
                  isRoaming:
                    type: boolean
                    description: TRUE if the device is known to be in a roaming state
                  isDataAvailable:
                    type: boolean
                required:
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
            device:
              oneOf:
              - additionalProperties: false
                title: Successful discover.device response
                properties:
                  IMEI:
                    type: object
                    required:
                    - is
                    properties:
                      is:
                        type: string
                        example: '969455279101641'
                        description: Echoes the input IMEI
                  serialNo:
                    type: object
                    properties:
                      value:
                        type:
                        - string
                        - 'null'
                        example: 12A34BCD
                        description: A unique code assigned by the manufacturer to help identify an individual device
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - value
                    - isDataAvailable
                  model:
                    type: object
                    properties:
                      code:
                        type:
                        - string
                        - 'null'
                        example: iPhone XR (A2105)
                        description: Technical model name given by the manufacturer
                      name:
                        type:
                        - string
                        - 'null'
                        example: iPhone XR
                        description: Consumer model name given by the manufacturer
                      brand:
                        type:
                        - string
                        - 'null'
                        example: Apple
                        description: Name of the manufacturer / companies
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - code
                    - name
                    - brand
                    - isDataAvailable
                  activation:
                    type: object
                    properties:
                      isActivated:
                        type:
                        - boolean
                        - 'null'
                        example: true
                        description: Indicates if the phone has been activated
                      isDataAvailable:
                        type: boolean
                        example: true
                      date:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        example: '2022-07-11T20:08:04+00:00'
                        description: The date that the device was activated, if known
                    required:
                    - isActivated
                    - isDataAvailable
                    - date
                  estimatedPurchase:
                    type: object
                    required:
                    - date
                    - isDataAvailable
                    properties:
                      date:
                        type:
                        - string
                        - 'null'
                        format: date
                        example: '2021-03-15'
                        description: The estimated date of purchase in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates) format
                      isDataAvailable:
                        type: boolean
                        example: true
                  blacklist:
                    type: object
                    properties:
                      status:
                        type:
                        - boolean
                        - 'null'
                        example: true
                        description: Indicates if the device is currently blacklisted
                      isDataAvailable:
                        type: boolean
                        example: true
                      addEvent:
                        type:
                        - object
                        - 'null'
                        required:
                        - date
                        - by
                        - reason
                        properties:
                          date:
                            type:
                            - string
                            - 'null'
                            example: '2023-01-24 08:32:08'
                            description: The most recent date the device was reported blacklisted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                          by:
                            type:
                            - string
                            - 'null'
                            example: Hutchison 3G UK
                            description: The operator or other party who last updated blacklist status
                          reason:
                            type:
                            - string
                            - 'null'
                            example: stolen or lost
                            description: The reason given for the blacklist event
                      removeEvent:
                        type:
                        - object
                        - 'null'
                        required:
                        - date
                        - by
                        - reason
                        properties:
                          date:
                            type:
                            - string
                            - 'null'
                            example: '2023-01-24 08:32:08'
                            description: The most recent date the device was remove from the blacklisted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                          by:
                            type:
                            - string
                            - 'null'
                            example: Hutchison 3G UK
                            description: The operator or other party who last requested the removal from the blacklist
                          reason:
                            type:
                            - string
                            - 'null'
                            example: found
                            description: The reason given for the removal from the blacklist
                      history:
                        type:
                        - object
                        - 'null'
                        required:
                        - blacklistedCount
                        - removedCount
                        - operators
                        properties:
                          blacklistedCount:
                            type:
                            - integer
                            - 'null'
                            example: 10
                            description: Number of times device has been blacklisted
                          removedCount:
                            type:
                            - integer
                            - 'null'
                            example: 2
                            description: Number of times the device has been removed from the GSMA blacklist
                          operators:
                            type:
                            - integer
                            - 'null'
                            example: 2
                            description: Number of unique operators or other parties who have blacklisted the device
                    required:
                    - status
                    - isDataAvailable
                    - addEvent
                    - removeEvent
                    - history
                  retail:
                    type: object
                    properties:
                      currency:
                        type:
                        - string
                        - 'null'
                        example: USD
                        description: Indicates the currency used for the retail price
                      prices:
                        type: array
                        example:
                        - '1247'
                        - '1366'
                        - '1604'
                        - '1842'
                        description: Array containing the various retail prices for device model releases
                      storageOptions:
                        type: array
                        example:
                        - 128 GB
                        - 256 GB
                        - 512 GB
                        - 1 TB
                        description: Array containing the device model variants
                      releaseDate:
                        type:
                        - string
                        - 'null'
                        example: '2021-09-01'
                        description: The release date for the device model
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - isDataAvailable
                required:
                - IMEI
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
      required:
      - discover
    AssureProductRequest:
      title: Assure Product Request
      type: object
      description: "The following is the schema of a call to all Assure products on a mobile number  \nAssure comes with matchingName, matchingAddress, and matchingBirthDate. matchingAge and matchingDeviceInfo are additional features that require specific access  \nNone of the features are required, but at least one must be present in the body to make a successful Assure call  \nNote: KYC matching in Spain requires a positive match response for matchingIdentityDocument"
      properties:
        assure:
          type: object
          description: To make a call to Assure you will need at least one of the product features below in the body
          additionalProperties: false
          minProperties: 1
          properties:
            matchingName:
              type: object
              description: Verify the first and last name of the subscriber
              properties:
                firstName:
                  type: string
                  description: First name
                  example: Katharine
                lastName:
                  type: string
                  description: Last name
                  example: Parsons
                email:
                  type: string
                  pattern: ^\S+@\S+$
                  minLength: 3
                  maxLength: 320
                  description: Email
              required:
              - firstName
              - lastName
            matchingIdentityDocument:
              description: Verify the national identity number for the subscriber - required for KYC matching in Spain
              type: object
              minProperties: 1
              properties:
                nationalIdentity:
                  type: object
                  properties:
                    reference:
                      type: string
                      description: National identity document number
                      example: 99999999R
                  required:
                  - reference
            matchingAddress:
              description: Verify the address data of the subscriber. Address feature availability is on a per country basis, see [here](https://developer.api.v3.phronesis.tech/docs/network-biometrics/igp7apeu9g4tk-calling-network-biometrics#assure) for details.
              type: object
              minProperties: 1
              properties:
                houseNumber:
                  type: string
                  description: House number without street name
                  example: '20'
                houseName:
                  type: string
                  description: House name
                  example: Michael Faraday House
                streetAddress:
                  type: string
                  description: Street address including house name/number
                  example: 20 Michael Faraday House
                postcode:
                  type: string
                  example: SG1 2AY
                  description: Postal code
                locality:
                  type: string
                  example: Paris
                  description: Town/City
                province:
                  type: string
                  example: Minnesota
                  description: State/region name
                country:
                  type: string
                  example: England
                  description: country name in [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1)
            matchingBirthDate:
              type: object
              description: Verify the birthdate of the subscriber
              minProperties: 1
              properties:
                dateOfBirth:
                  type: string
                  example: '1859-01-01'
                  format: date
                  pattern: ^([1|2]{1}[0-9]{3})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9])$
                  description: Date of birth as yyyy-mm-dd
              required:
              - dateOfBirth
            matchingAge:
              type: object
              description: Verify the age of the subscriber
              minProperties: 1
              properties:
                greaterThanYears:
                  type: integer
                  example: 18
                  minimum: 18
                  maximum: 18
                  default: 18
                  description: Fixed value of 18.
              required:
              - greaterThanYears
            hasServiceRestriction:
              type: object
              description: Check subscriber restriction settings e.g. Content Lock
              properties:
                for:
                  type: array
                  minItems: 1
                  example:
                  - adultContent
                  items:
                    type: string
                    enum:
                    - adultContent
              required:
              - for
            matchingDeviceInfo:
              type: object
              description: Confirm the connected device is as expected
              minProperties: 1
              properties:
                IMEI:
                  type: string
                  example: '969455279101647'
                  minLength: 14
                  maxLength: 15
                  description: 15-digit code that identifies a device
                  pattern: ^\d{14,15}$
                calculateCheckDigit:
                  type: boolean
                  x-stoplight:
                    id: 67cfyeta5o5q9
                  default: false
                  description: calculate check digit for 14-digit IMEI
              required:
              - IMEI
            matchingAccountInfo:
              type: object
              description: Retrieve additional information about the subscriber account
              properties:
                for:
                  type: array
                  minItems: 1
                  example:
                  - isActive
                  - contractType
                  - lostOrStolen
                  items:
                    type: string
                    enum:
                    - isActive
                    - contractType
                    - lostOrStolen
              required:
              - for
      required:
      - assure
    NetworkBiometricProductRequest:
      type: object
      example:
        discover:
          number: '447700900604'
          hasNumberBeenRecycled:
            inSeconds: 900
          hasMVNOInfo:
            filterMVNO: true
          device:
            IMEI: '351490789456123'
            for:
            - serialNo
            - model
            - activation
            - blacklist
          hasHomeNetworkInfo:
            for:
            - roaming
        assure:
          matchingName:
            firstName: William
            lastName: Herschel
          matchingAddress:
            houseNumber: '10'
            houseName: Herschel Museum of Astronomy
            postcode: BA1 2BL
          matchingBirthDate:
            dateOfBirth: '1738-11-15'
          matchingAge:
            greaterThanYears: 18
          hasServiceRestriction:
            for:
            - adultContent
          matchingDeviceInfo:
            IMEI: '306772992380426'
          matchingAccountInfo:
            for:
            - isActive
            - contractType
            - lostOrStolen
        protect:
          hasSimChanged:
            inSeconds: 900
          hasDeviceChanged:
            inSeconds: 900
          hasAccountTenure:
            greaterThanDate: '2020-03-21'
          hasContractInfo:
            for:
            - startDate
          hasCallForwarding:
            for: unconditional
          hasActiveCall:
            withMinimumDuration:
              inSeconds: 120
            with:
            - callDirection
            - callDuration
            - callingNumberWithheld
          hasDeviceInfo:
            for:
            - IMEI
            - serialNo
            - model
            - activation
          wasReportedLostOrStolen:
            inDate: '2020-03-03'
          wasBlacklisted:
            inDate: '2023-01-24'
      description: The schema for the Network Biometrics request
      additionalProperties: false
      required:
      - discover
      properties:
        discover:
          $ref: '#/components/schemas/DiscoverProductRequest/properties/discover'
        assure:
          $ref: '#/components/schemas/AssureProductRequest/properties/assure'
        protect:
          $ref: '#/components/schemas/ProtectProductRequest/properties/protect'
    AssureProductResponse:
      title: Assure Product Response
      type: object
      example:
        assure:
          matchingName:
            firstName:
              isDataAvailable: true
              isMatched: true
              matchConfidence: 100
            lastName:
              isDataAvailable: true
              isMatched: true
              matchConfidence: 100
            fullName:
              isMatched: true
              isDataAvailable: true
              matchConfidence: 100
            email:
              isMatched: true
              isDataAvailable: true
              matchConfidence: 100
          matchingAddress:
            fullAddress:
              isDataAvailable: true
              isMatched: true
              matchConfidence: 100
            houseNameOrNumber:
              isDataAvailable: false
              isMatched: false
              matchConfidence: 100
            postcode:
              isDataAvailable: true
              isMatched: true
              matchConfidence: 100
          matchingBirthDate:
            isDataAvailable: true
            isMatched: true
            matchConfidence: 100
          matchingAge:
            isDataAvailable: true
            isMatched: true
          matchingDeviceInfo:
            IMEI:
              isMatched: true
              checked: '353090101175010'
          matchingAccountInfo:
            account:
              isActive: true
              isDataAvailable: true
            contractType:
              is: PAYM
              isDataAvailable: true
            lostOrStolen:
              isReportedLostOrStolen: false
              isDataAvailable: true
          hasServiceRestriction:
            adultContent:
              isUnlocked: true
              isDataAvailable: true
      description: assure product response data
      properties:
        assure:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            matchingName:
              oneOf:
              - additionalProperties: false
                title: Successful matchingName response
                properties:
                  firstName:
                    type: object
                    additionalProperties: false
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: measure of similarity, the higher the value, the more similar the strings are. The score is normalized so that 0 represents no similarities, and 100 is an exact match
                  lastName:
                    type: object
                    additionalProperties: false
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: Integer between 0-100 representing a percentage score of how similar the request data matches with user data
                  email:
                    type: object
                    additionalProperties: false
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: "Integer between 0-100 representing a percentage score of how similar the request data matches with user data  \n***For date-of-birth matching, only a 100% match will trigger the isMatched flag to become true***"
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                  fullName:
                    type: object
                    additionalProperties: false
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: Integer between 0-100 representing a percentage score of how similar the request data matches with user data
                required:
                - firstName
                - lastName
                - fullName
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            matchingIdentityDocument:
              oneOf:
              - additionalProperties: false
                title: Successful matchingIdentityDocument response
                minProperties: 1
                properties:
                  nationalIdentity:
                    type: object
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            matchingAddress:
              oneOf:
              - additionalProperties: false
                title: Successful matchingAddress response
                required:
                - fullAddress
                minProperties: 2
                properties:
                  fullAddress:
                    type: object
                    additionalProperties: false
                    description: 'Aggregated from all available address data, e.g. house name/number and postcode in the UK or street, locality and postcode for France

                      and **locality**, **streetAddress**, **postcode** for French lookup'
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: Integer between 0-100 representing a percentage score of how similar the request data matches with user data
                  houseNameOrNumber:
                    type: object
                    additionalProperties: false
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
