                    - serialNo
                    - model
                    - activation
                    - purchaseDate
              required:
              - for
            wasBlacklisted:
              oneOf:
              - additionalProperties: false
                title: inSeconds
                description: 'Determine if a device has been blacklisted by GSMA within the specified time period

                  '
