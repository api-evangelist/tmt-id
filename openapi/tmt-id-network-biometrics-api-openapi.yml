    DiscoverProductRequest:
      title: Discover Product Request
      type: object
      description: 'The following is the schema of a call to all Discover products for a mobile number and/or device IMEI number.

        To request more information about a mobile number, include the Discover product''s optional features. These are subject to an additional charge and require specific access.'
      additionalProperties: false
      minProperties: 1
      properties:
        discover:
          oneOf:
          - additionalProperties: false
            title: number
            properties:
              number:
                type: string
                pattern: ^\+?[1-9]\d{1,14}$
                minLength: 5
                maxLength: 15
                example: '447700900704'
                description: Phone number (MSISDN) to be validated, including country code per [E.164](https://en.wikipedia.org/wiki/E.164) standard
              hasMVNOInfo:
                description: Retrieve additional information about a virtual mobile network (MVNO) if available
                type: object
                properties:
                  filterMVNO:
                    type: boolean
                    example: true
                    description: Apply MVNO pre-filtering on Assure and Protect features where they are likely to fail
                required:
                - filterMVNO
              hasNumberBeenRecycled:
                description: Determine if the number has been recycled within the specified time period
                type: object
                oneOf:
                - additionalProperties: false
                  title: inSeconds
                  properties:
                    inSeconds:
                      type: integer
                      example: 120
                      description: set look-back period in past seconds
                - additionalProperties: false
                  title: inMinutes
                  properties:
                    inMinutes:
                      type: integer
                      example: 40
                      description: set look-back period in past minutes
                - additionalProperties: false
                  title: inHours
                  properties:
                    inHours:
                      type: integer
                      example: 12
                      description: set look-back period in past hours
                - additionalProperties: false
                  title: inDays
                  properties:
                    inDays:
                      type: integer
                      example: 30
                      description: set look-back period in past days
                - additionalProperties: false
                  title: inDate
                  properties:
                    inDate:
                      type: string
                      format: date
                      example: '2021-03-01'
                      description: set look-back period to a fixed date
              hasHomeNetworkInfo:
                description: 'Retrieve additional information about the home network

                  '
                type: object
                properties:
                  for:
                    type: array
                    description: list of home network information to lookup
                    items:
                      type: string
                      example: roaming
                required:
                - for
              device:
                description: Retrieve additional information about a device using IMEI
                type: object
                properties:
                  IMEI:
                    type: string
                    pattern: ^\d{14,15}$
                    example: '969455279101647'
                    minLength: 14
                    maxLength: 15
                    description: 15-digit code that identifies a device
                  calculateCheckDigit:
                    type: boolean
                    x-stoplight:
                      id: irc102lzvjhhi
                    description: calculate check digit for 14-digit IMEI
                    default: false
                  for:
                    type: array
                    minItems: 1
                    example:
                    - serialNo
                    - model
                    - activation
                    - blacklist
                    - purchaseDate
                    - retail
                    description: list of device information to lookup
                    items:
                      type: string
                      enum:
                      - serialNo
                      - model
                      - activation
                      - blacklist
                      - purchaseDate
                      - retail
                required:
                - IMEI
                - for
            required:
            - number
          - additionalProperties: false
            title: device
            properties:
              device:
                description: Retrieve additional information about a device using IMEI number lookup
                type: object
                required:
                - IMEI
                - for
                properties:
                  IMEI:
                    type: string
                    pattern: ^\d{14,15}$
                    example: '969455279101647'
                    minLength: 14
                    maxLength: 15
                    description: 15-digit code that identifies a device
                  calculateCheckDigit:
                    type: boolean
                    x-stoplight:
                      id: 8og6ptuh25aim
                    default: false
                    description: calculate check digit for 14-digit IMEI
                  for:
                    type: array
                    minItems: 1
                    example:
                    - serialNo
                    - model
                    - activation
                    - blacklist
                    - purchaseDate
                    - retail
                    description: list of device information to lookup
                    items:
                      type: string
                      enum:
                      - serialNo
                      - model
                      - activation
                      - blacklist
                      - purchaseDate
                      - retail
            required:
            - device
          type: object
  examples:
    AgeEligibilityRequest:
      description: "### Age Eligibility  \nUse the Age Eligibility feature to validate if a mobile subscriber is known to be at least 18 years of age and help control access to age-restricted products and services.  \n> In using this feature, please note that some datasource restrictions might apply, including:  \n  > - the number must be associated with an active subscription on a supported mobile network (**MVNOs excluded**),\n  > - the number must belong to the subscription holder and bill-payer,\n  > - the subscription must be a pay monthly contract (**PAYM**)."
      value:
        discover:
          number: '447700900704'
        assure:
          matchingAge:
            greaterThanYears: 18
          hasServiceRestriction:
            for:
            - adultContent
    ProtectRequest:
      description: "## Protect\nBe certain that the information your customer is providing is true and that they aren't currently being impersonated.  \nIdentify **SIM** or **Device** swap events and detect **Account Takeover**."
