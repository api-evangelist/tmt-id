- description: "\nENUM TeleShield __Routing__ Successful Command and Answer:\n\n    Command:\n    dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 0.6.0.0.1.6.6.6.7.0.4.r-teleshield.tmtid.com\n\n    Answer:\n    10 100 \"u\" \"E2U+pstn:tel\"\n    \"!^(.*)$!tel:\\\\1;cc=ro;ocic=4018760;oocn=;it=1;et=10;omcc=226;omnc=03;onsn=COSM;err=0\n\nENUM TeleShield Routing error response for invalid number formats:\n\n  1. Input number has __no Country Code match__.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 9.9.9.9.9.9.r-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;err=1;msg=invalid_number!\".\n\n  2. Input number has the __wrong length__.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 4.2.0.7.5.2.2.7.0.4.r-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;err=2;msg=invalid_number_length!\".\n\n  3. Input number is <strong>not part of an allocated range from the regulator.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 7.3.8.5.7.8.5.9.9.0.4.r-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;err=3;msg=invalid_number_range!\".\n\nENUM – TeleShield __Routing__ error response for Unauthorized Access\n> The output status is NXDOMAIN and the answer section is blank."
  name: ENUM TeleShield Routing v2.0
- description: "\nENUM TeleShield __Fraud__ Successful Command and Answer:\n\n    Command:\n    dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 7.2.7.6.5.2.3.5.4.3.1.f-teleshield.tmtid.com\n\n    Answer:\n    10 100 \"u\" \"E2U+pstn:tel\"\n    \"!^(.*)$!tel:\\\\1;cc=ky;ocic=1345505;oocn=;it=1;et=10;omcc=346;omnc=050;onsn=DIGICEL;ts=15;tl=L;iprnn=1;iprnnd=20221006;iprnnl=20230620;iprnr=1;iprnrd=20221006;iprnrl=20230620;msrn=0;msrnd=;msrnl=;err=0!\"\n\nENUM TeleShield Fraud error response for invalid number formats:\n\n  The TeleShield Score and TeleShield Level of assessment for the number to be part of a fraud scheme are set to the highest level. See examples below:\n\n  1. Input number has __no Country Code match__.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 9.9.9.9.9.9.f-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;ts=100;tl=H;err=1;msg=invalid_number!\".\n\n  2. Input number has the __wrong length__.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 4.2.0.7.5.2.2.7.0.4.f-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;ts=100;tl=H;err=2;msg=invalid_number_length!\".\n\n  3. Input number is __not part of an allocated range__ from the regulator.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 7.3.8.5.7.8.5.9.9.0.4.f-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;ts=100;tl=H;err=3;msg=invalid_number_range!\".\n\nENUM – TeleShield __Fraud__ error response for Unauthorized Access\n> The output status is NXDOMAIN and the answer section is blank."
  name: ENUM TeleShield Fraud v2.0
- description: "\nENUM TeleShield __Enhanced Fraud__ Successful Command and Answer:\n\n    Command:\n    dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 7.2.7.6.5.2.3.5.4.3.1.e-teleshield.tmtid.com\n\n    Answer:\n    10 100 \"u\" \"E2U+pstn:tel\"\n    \"!^(.*)$!tel:\\\\1;cc=ro;ocic=4018760;oocn=;it=1;et=10;omcc=226;omnc=03;onsn=COSM;np=no;pd=20171123;cic=4018760;ocn=;mcc=226;mnc=03;nsn=COSM;ss=yes;ts=0;tl=L;iprnn=0;iprnnd=;iprnnl=;iprnr=0;iprnrd=;iprnrl=;msrn=0;msrnd=;msrnl=;err=0!\"\n\nENUM TeleShield Enhanced Fraud error response for invalid number formats:\n\n  The TeleShield Score and TeleShield Level of assessment for the number to be part of a fraud scheme are set to the highest level. See examples below:\n\n  1. Input number has __no Country Code match__.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 9.9.9.9.9.9.e-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;ts=100;tl=H;err=1;msg=invalid_number!\".\n\n  2. Input number has the __wrong length__.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 4.2.0.7.5.2.2.7.0.4.e-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;ts=100;tl=H;err=2;msg=invalid_number_length!\".\n\n  3. Input number is __not part of an allocated range__ from the regulator.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 7.3.8.5.7.8.5.9.9.0.4.e-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;ts=100;tl=H;err=3;msg=invalid_number_range!\".\n\n> NOTE: Two additional Error scenarios are possible based on the availability of the two supplementary real-time network calls (NP and Presence).\n* Available Number Portability (np) / Unavailable Presence.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 4.4.0.0.0.0.0.1.0.7.4.3.2.e-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;cc=uz;ocic=998505;oocn=;it=1;et=11;omcc=434;omnc=08;onsn=UZBEKTELE;np=no;pd=;cic=998505;ocn=;mcc=434;mnc=08;nsn=UZBEKTELE;ss=na;ts=0;tl=L;iprnn=0;iprnnd=;iprnnl=;iprnr=0;iprnrd=;iprnrl=;msrn=0;msrnd=;msrnl=;err=4!\"\n\n* Unavailable Number Portability (np) / Unavailable Presence.\n\n  > Note: In this case Ported and Ported Date fields are hidden.\n\n          Command:\n          dig +short +noedns +tries=1 +time=7 -t NAPTR @195.181.168.240 2.0.3.8.7.0.4.4.0.3.2.9.e-teleshield.tmtid.com\n\n          Answer:\n          10 100 \"u\" \"E2U+pstn:tel\" \"!^(.*)$!tel:\\\\1;cc=pk;ocic=92500;oocn=;it=1;et=10;omcc=410;omnc=01;onsn=JAZZ-MOBILINK;np=na;pd=;cic=92500;ocn=;mcc=410;mnc=01;nsn=JAZZ-MOBILINK;ss=na;ts=0;tl=L;iprnn=0;iprnnd=;iprnnl=;iprnr=0;iprnrd=;iprnrl=;msrn=0;msrnd=;msrnl=;err=5!\".\n\nENUM – TeleShield __Enhanced Fraud__ error response for Unauthorized Access\n> The output status is NXDOMAIN and the answer section is blank."
