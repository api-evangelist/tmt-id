      description: assure product response data
      properties:
        assure:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            matchingName:
              oneOf:
              - additionalProperties: false
                title: Successful matchingName response
                properties:
                  firstName:
                    type: object
                    additionalProperties: false
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
