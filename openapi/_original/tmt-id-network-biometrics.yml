                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: Integer between 0-100 representing a percentage score of how similar the request data matches with user data
                  email:
                    type: object
                    additionalProperties: false
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: "Integer between 0-100 representing a percentage score of how similar the request data matches with user data  \n***For date-of-birth matching, only a 100% match will trigger the isMatched flag to become true***"
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                  fullName:
                    type: object
                    additionalProperties: false
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
                      isDataAvailable:
                        type: boolean
                        example: true
                      isMatched:
                        type: boolean
                        example: true
                      matchConfidence:
                        type: integer
                        example: 100
                        description: Integer between 0-100 representing a percentage score of how similar the request data matches with user data
                required:
                - firstName
                - lastName
                - fullName
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
