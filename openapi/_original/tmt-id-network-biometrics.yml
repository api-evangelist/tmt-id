components:
  headers:
    Correlation-Id:
      schema:
        type: string
        example: 251250b0-05a5-44b1-9d6d-6d1c78e8d994
        description: A user-generated string to aid in matching requests; this is echoed back in the response headers
  securitySchemes:
    token:
      name: API-Token
      type: apiKey
      in: header
      description: API Token provided to you during the onboarding process
    secret:
      name: API-Secret
      type: apiKey
      in: header
      description: API Secret provided to you during the onboarding process
  examples:
    DiscoverRequest:
      description: '## Discover

        Supports input of a mobile phone number and/or a device IMEI number.

        When supplied with a mobile phone number, it validates the number is correctly formatted, genuine, and reachable.

        Similarly, the IMEI is validated and is used to retrieve the requested device information.

        > The `discover` product is **required in every request** but additional products such as `assure` or `protect` can be added to the request object - the ordering is not significant (***see examples***).'
      value:
        discover:
          number: '447700900702'
          hasMVNOInfo:
            filterMVNO: true
          hasHomeNetworkInfo:
            for:
            - roaming
          device:
            IMEI: '351498789456123'
            for:
            - serialNo
            - model
            - activation
            - purchaseDate
            - blacklist
            - retail
    NumberRecycleRequest:
      description: "## Number recycle  \nUsed to confirm if a customer's mobile number is presently active and has not been recently deactivated or recycled, to prevent false number declarations."
      value:
        discover:
          number: '447700900704'
          hasNumberBeenRecycled:
            inSeconds: 900
    AssureRequest:
      description: "## Assure\nStep up the protection and verify the mobile number a user is providing to assert their identity is registered to them and does not carry any suspicious activity flags.  \nAdd confidence with Know Your Customer (**KYC**) matching."
      value:
        discover:
          number: '447700900704'
        assure:
          matchingName:
            firstName: Katharine
            lastName: Parsons
          matchingAddress:
            houseNumber: '10'
            houseName: Michael Faraday House
            postcode: SG1 2AY
          matchingBirthDate:
            dateOfBirth: '1859-01-01'
    AssureRequestFrance:
      description: "## Assure France\nStep up the protection and verify the mobile number a user is providing to assert their identity is registered to them and does not carry any suspicious activity flags.  \nAdd confidence with Know Your Customer (**KYC**) matching. \n> Be aware of the differences on the properties supplied for `matchingAddress` and that email validation is available consistently across the French market"
      value:
        discover:
          number: '33609666039'
        assure:
          matchingName:
            firstName: Jean-Yves
            lastName: Lafesse
            email: jy.lafess@humour.com
          matchingAddress:
            streetAddress: 64 Le Grand Détournement
            locality: Pontivy
            postcode: '56300'
            country: France
          matchingBirthDate:
            dateOfBirth: '1957-03-13'
    AssureDeviceInfoRequest:
      description: '## Assure Device Information

        Check that the device ID (i.e. IMEI) you''re expecting is the same one associated with the provided mobile number.'
      value:
        discover:
          number: '447700900601'
        assure:
          matchingDeviceInfo:
            IMEI: '306772992380426'
    ProtectRequest:
      description: "## Protect\nBe certain that the information your customer is providing is true and that they aren't currently being impersonated.  \nIdentify **SIM** or **Device** swap events and detect **Account Takeover**."
      value:
        discover:
          number: '447700900602'
        protect:
          hasSimChanged:
            inSeconds: 900
          hasDeviceChanged:
            inSeconds: 900
          hasCallForwarding:
            for: unconditional
          hasAccountTenure:
            greaterThanDate: '2020-03-21'
          hasActiveCall:
            withMinimumDuration:
              inSeconds: 120
            with:
            - callDirection
            - callDuration
            - callingNumberWithheld
    ProtectDeviceInfoRequest:
      description: '## Protect Device Information

        Return details about the device currently connected to the supplied mobile number'
      value:
        discover:
          number: '447700900600'
        protect:
          hasDeviceInfo:
            for:
            - IMEI
            - serialNo
            - model
            - activation
            - purchaseDate
    AgeEligibilityRequest:
      description: "### Age Eligibility  \nUse the Age Eligibility feature to validate if a mobile subscriber is known to be at least 18 years of age and help control access to age-restricted products and services.  \n> In using this feature, please note that some datasource restrictions might apply, including:  \n  > - the number must be associated with an active subscription on a supported mobile network (**MVNOs excluded**),\n  > - the number must belong to the subscription holder and bill-payer,\n  > - the subscription must be a pay monthly contract (**PAYM**)."
      value:
        discover:
          number: '447700900704'
        assure:
          matchingAge:
            greaterThanYears: 18
          hasServiceRestriction:
            for:
            - adultContent
    AllServicesRequest:
      description: '## All available service

