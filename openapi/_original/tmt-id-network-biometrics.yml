      title: Protect Product Response
      type: object
      description: 'All the features are stand-alone and require the correct access to be used.

        Note: the protect.wasBlacklisted syntax has subtle differences from discover.device.blacklist, these are distinct products with different use cases.'
      additionalProperties: false
      properties:
        protect:
          type: object
          minProperties: 1
          properties:
            hasSimChanged:
              oneOf:
              - additionalProperties: false
                title: Successful hasSimChanged response
                properties:
                  changedInTimePeriod:
                    type: boolean
                    example: true
                    description: Has a change taken place in the specified time
                  lastChange:
                    type: string
                    example: '2022-10-19T10:44:35+00:00'
                    format: date-time
                    description: The time of last known sim change in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                    nullable: true
                required:
                - changedInTimePeriod
                - lastChange
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasDeviceChanged:
              oneOf:
              - additionalProperties: false
                title: Successful hasDeviceChanged response
                properties:
                  changedInTimePeriod:
                    type: boolean
                    example: false
                    description: Has a change taken place in the specified time
                  lastChange:
                    type: string
                    example: null
                    format: date-time
                    description: The time of last known device change in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                    nullable: true
                required:
                - changedInTimePeriod
                - lastChange
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            wasReportedLostOrStolen:
              oneOf:
              - additionalProperties: false
                title: Successful wasReportedLostOrStolen response
                properties:
                  inPeriod:
                    type: boolean
                    example: true
                    description: Has been reported for lost or stolen in the specified time
                    nullable: true
                  isDataAvailable:
                    type: boolean
                    example: true
                  isLostOrStolen:
                    type: boolean
                    example: true
                    nullable: true
                  lostOrStolenDate:
                    type: string
                    format: date-time
                    example: '2023-02-12T17:42:14+00:00'
                    description: some description
                    nullable: true
                required:
                - inPeriod
                - isDataAvailable
                - isLostOrStolen
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasAccountTenure:
              oneOf:
              - additionalProperties: false
                title: Successful hasAccountTenure response
                properties:
                  longerThanPeriod:
                    type: boolean
                    nullable: true
                    example: false
                    description: Has the account been associated with the current subscriber for the specified time or longer
                  isDataAvailable:
                    type: boolean
                    example: true
                required:
                - longerThanPeriod
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasContractInfo:
              oneOf:
              - additionalProperties: false
                title: Successful hasContractInfo response
                properties:
                  startDate:
                    type: string
                    format: date
                    example: '2021-03-15'
                    description: The date of the account creation in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format
                    nullable: true
                  isDataAvailable:
                    type: boolean
                    example: true
                required:
                - startDate
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasCallForwarding:
              oneOf:
              - additionalProperties: false
                title: Successful hasCallForwarding response
                minProperties: 1
                properties:
                  unconditional:
                    type: boolean
                    example: false
                    description: Indicates if the subscriber has unconditional call forwarding enabled
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasActiveCall:
              oneOf:
              - properties:
                  isDataAvailable:
                    type: boolean
                  isOnCallNow:
                    type: boolean
                    description: the subscriber is currently on a call
                    nullable: true
                  callDuration:
                    type: object
                    additionalProperties: false
                    description: duration of the active call, if any
                    properties:
                      isDataAvailable:
                        type: boolean
                      seconds:
                        type: integer
                        example: 1234
                        minimum: 0
                        description: call duration is seconds
                        nullable: true
                      started:
                        type: string
                        format: date-time
                        example: '2022-01-01T10:57:57'
                        description: approximate time call started, if available
                      exceedsDuration:
                        type: boolean
                        description: the call exceeds the specified duration
                        nullable: true
                    required:
                    - isDataAvailable
                    - seconds
                  callDirection:
                    type: object
                    additionalProperties: false
                    description: direction of the originating call
                    properties:
                      isDataAvailable:
                        type: boolean
                      isReceived:
                        type: boolean
                        description: the call was received
                        nullable: true
                    required:
                    - isDataAvailable
                    - isReceived
                  callingNumber:
                    type: object
                    additionalProperties: false
                    description: 'about the calling number '
                    properties:
                      isDataAvailable:
                        type: boolean
                      isWithheld:
                        type: boolean
                        description: the calling number was withheld
                        nullable: true
                    required:
                    - isDataAvailable
                    - isWithheld
                required:
                - isDataAvailable
                - isOnCallNow
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasDeviceInfo:
              oneOf:
              - additionalProperties: false
                minProperties: 1
                title: Successful hasDeviceInfo response
                properties:
                  IMEI:
                    type: object
                    properties:
                      value:
                        type: string
                        example: '545720379182608'
                        minLength: 15
                        maxLength: 15
                        pattern: ^\d{15}$
                        description: A unique 15-digit code that identifies a device
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - value
                    - isDataAvailable
                  serialNo:
                    type: object
                    properties:
                      value:
                        type: string
                        example: 12A34BCD
                        description: A unique code assigned by the manufacturer to help identify an individual device
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - value
                    - isDataAvailable
                  model:
                    type: object
                    properties:
                      code:
                        type: string
                        example: iPhone XR (A2105)
                        description: Technical model name given by the manufacturer
                        nullable: true
                      name:
                        type: string
                        example: iPhone XR
                        description: Consumer model name given by the manufacturer
                        nullable: true
                      brand:
                        type: string
                        example: Apple
                        description: Name of the manufacturer / companies
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - code
                    - name
                    - brand
                    - isDataAvailable
                  activation:
                    type: object
                    properties:
                      isActivated:
                        type: boolean
                        example: true
                        description: Indicates if the phone has been activated
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                      date:
                        type: string
                        format: date-time
                        example: '2022-07-11T20:08:04+00:00'
                        description: The date that the device was activated, if known
                        nullable: true
                    required:
                    - isActivated
                    - isDataAvailable
                    - date
                  estimatedPurchase:
                    type: object
                    required:
                    - date
                    - isDataAvailable
                    properties:
                      date:
                        type: string
                        format: date
                        example: '2021-03-15'
                        description: The estimated date of purchase in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates) format
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            wasBlacklisted:
              oneOf:
              - additionalProperties: false
                title: Successful wasBlacklisted response
                properties:
                  inPeriod:
                    type: boolean
                    example: true
                    description: Has been blacklisted in the specified time
                  blacklistStatus:
                    type: boolean
                    example: true
                    description: Indicates if the device is currently blacklisted
                    nullable: true
                  isDataAvailable:
                    type: boolean
                    example: true
                  blacklistEvent:
                    type: object
                    required:
                    - date
                    - by
                    - reason
                    nullable: true
                    properties:
                      date:
                        type: string
                        example: '2023-01-24 08:32:08'
                        description: The most recent date the device was reported blacklisted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                        nullable: true
                      by:
                        type: string
                        example: Hutchison 3G UK
                        description: The operator or other party who last updated blacklist status
                        nullable: true
                      reason:
                        type: string
                        example: stolen or lost
                        description: The reason given for the blacklist event
                        nullable: true
                  removeEvent:
                    type: object
                    required:
                    - date
                    - by
                    - reason
                    nullable: true
                    properties:
                      date:
                        type: string
                        example: '2023-01-24 08:32:08'
                        description: The most recent date the device was remove from the blacklisted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                        nullable: true
                      by:
                        type: string
                        example: Hutchison 3G UK
                        description: The operator or other party who last requested the removal from the blacklist
                        nullable: true
                      reason:
                        type: string
                        example: found
                        description: The reason given for the removal from the blacklist
                        nullable: true
                  history:
                    type: object
                    required:
                    - blacklistedCount
                    - removedCount
                    - operators
                    nullable: true
                    properties:
                      blacklistedCount:
                        type: integer
                        example: 10
                        description: Number of times device has been blacklisted
                        nullable: true
                      removedCount:
                        type: integer
                        example: 2
                        description: Number of times the device has been removed from the GSMA blacklist
                        nullable: true
                      operators:
                        type: integer
                        example: 2
                        description: Number of unique operators or other parties who have blacklisted the device
                        nullable: true
                required:
                - inPeriod
                - blacklistStatus
                - isDataAvailable
                - blacklistEvent
                - removeEvent
                - history
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
      required:
      - protect
    TransactionResponse:
      title: Transaction Response
      example:
