  schemas:
    DiscoverProductRequest:
      title: Discover Product Request
      type: object
      description: 'The following is the schema of a call to all Discover products for a mobile number and/or device IMEI number.

        To request more information about a mobile number, include the Discover product''s optional features. These are subject to an additional charge and require specific access.'
      additionalProperties: false
      minProperties: 1
      properties:
        discover:
          oneOf:
          - additionalProperties: false
            title: number
            properties:
              number:
                type: string
                pattern: ^\+?[1-9]\d{1,14}$
                minLength: 5
                maxLength: 15
                example: '447700900704'
                description: Phone number (MSISDN) to be validated, including country code per [E.164](https://en.wikipedia.org/wiki/E.164) standard
              hasMVNOInfo:
                description: Retrieve additional information about a virtual mobile network (MVNO) if available
                type: object
                properties:
                  filterMVNO:
                    type: boolean
                    example: true
                    description: Apply MVNO pre-filtering on Assure and Protect features where they are likely to fail
                required:
                - filterMVNO
              hasNumberBeenRecycled:
                description: Determine if the number has been recycled within the specified time period
                type: object
                oneOf:
                - additionalProperties: false
                  title: inSeconds
                  properties:
                    inSeconds:
                      type: integer
                      example: 120
                      description: set look-back period in past seconds
                - additionalProperties: false
                  title: inMinutes
                  properties:
                    inMinutes:
                      type: integer
                      example: 40
                      description: set look-back period in past minutes
                - additionalProperties: false
                  title: inHours
                  properties:
                    inHours:
                      type: integer
                      example: 12
                      description: set look-back period in past hours
                - additionalProperties: false
                  title: inDays
                  properties:
                    inDays:
                      type: integer
                      example: 30
                      description: set look-back period in past days
                - additionalProperties: false
                  title: inDate
                  properties:
                    inDate:
                      type: string
                      format: date
                      example: '2021-03-01'
                      description: set look-back period to a fixed date
              hasHomeNetworkInfo:
                description: 'Retrieve additional information about the home network

                  '
                type: object
                properties:
                  for:
                    type: array
                    description: list of home network information to lookup
                    items:
                      type: string
                      example: roaming
                required:
                - for
              device:
                description: Retrieve additional information about a device using IMEI
                type: object
                properties:
                  IMEI:
                    type: string
                    pattern: ^\d{14,15}$
                    example: '969455279101647'
                    minLength: 14
                    maxLength: 15
                    description: 15-digit code that identifies a device
                  calculateCheckDigit:
                    type: boolean
                    x-stoplight:
                      id: irc102lzvjhhi
                    description: calculate check digit for 14-digit IMEI
                    default: false
                  for:
                    type: array
                    minItems: 1
                    example:
                    - serialNo
                    - model
                    - activation
                    - blacklist
                    - purchaseDate
                    - retail
                    description: list of device information to lookup
                    items:
                      type: string
                      enum:
                      - serialNo
                      - model
                      - activation
                      - blacklist
                      - purchaseDate
                      - retail
                required:
                - IMEI
                - for
            required:
            - number
          - additionalProperties: false
            title: device
            properties:
              device:
                description: Retrieve additional information about a device using IMEI number lookup
                type: object
                required:
                - IMEI
                - for
                properties:
                  IMEI:
                    type: string
                    pattern: ^\d{14,15}$
                    example: '969455279101647'
                    minLength: 14
                    maxLength: 15
                    description: 15-digit code that identifies a device
                  calculateCheckDigit:
                    type: boolean
                    x-stoplight:
                      id: 8og6ptuh25aim
                    default: false
                    description: calculate check digit for 14-digit IMEI
                  for:
                    type: array
                    minItems: 1
                    example:
                    - serialNo
                    - model
                    - activation
                    - blacklist
                    - purchaseDate
                    - retail
                    description: list of device information to lookup
                    items:
                      type: string
                      enum:
                      - serialNo
                      - model
                      - activation
                      - blacklist
                      - purchaseDate
                      - retail
            required:
            - device
          type: object
    AssureProductRequest:
      title: Assure Product Request
      type: object
      description: "The following is the schema of a call to all Assure products on a mobile number  \nAssure comes with matchingName, matchingAddress, and matchingBirthDate. matchingAge and matchingDeviceInfo are additional features that require specific access  \nNone of the features are required, but at least one must be present in the body to make a successful Assure call  \nNote: KYC matching in Spain requires a positive match response for matchingIdentityDocument"
      properties:
        assure:
          type: object
          description: To make a call to Assure you will need at least one of the product features below in the body
          additionalProperties: false
          minProperties: 1
          properties:
            matchingName:
              type: object
              description: Verify the first and last name of the subscriber
              properties:
                firstName:
                  type: string
                  description: First name
                  example: Katharine
                lastName:
                  type: string
                  description: Last name
                  example: Parsons
                email:
                  type: string
                  pattern: ^\S+@\S+$
                  minLength: 3
                  maxLength: 320
                  description: Email
              required:
              - firstName
              - lastName
            matchingIdentityDocument:
              description: Verify the national identity number for the subscriber - required for KYC matching in Spain
              type: object
              minProperties: 1
              properties:
                nationalIdentity:
                  type: object
                  properties:
                    reference:
                      type: string
                      description: National identity document number
                      example: 99999999R
                  required:
                  - reference
            matchingAddress:
              description: Verify the address data of the subscriber. Address feature availability is on a per country basis, see [here](https://developer.api.v3.phronesis.tech/docs/network-biometrics/igp7apeu9g4tk-calling-network-biometrics#assure) for details.
              type: object
              minProperties: 1
              properties:
                houseNumber:
                  type: string
                  description: House number without street name
                  example: '20'
                houseName:
                  type: string
                  description: House name
                  example: Michael Faraday House
                streetAddress:
                  type: string
                  description: Street address including house name/number
                  example: 20 Michael Faraday House
                postcode:
                  type: string
                  example: SG1 2AY
                  description: Postal code
                locality:
                  type: string
                  example: Paris
                  description: Town/City
                province:
                  type: string
                  example: Minnesota
                  description: State/region name
                country:
                  type: string
                  example: England
                  description: country name in [ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1)
            matchingBirthDate:
              type: object
              description: Verify the birthdate of the subscriber
              minProperties: 1
              properties:
                dateOfBirth:
                  type: string
                  example: '1859-01-01'
                  format: date
                  pattern: ^([1|2]{1}[0-9]{3})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9])$
                  description: Date of birth as yyyy-mm-dd
              required:
              - dateOfBirth
            matchingAge:
              type: object
              description: Verify the age of the subscriber
              minProperties: 1
              properties:
                greaterThanYears:
                  type: integer
                  example: 18
                  minimum: 18
                  maximum: 18
                  default: 18
                  description: Fixed value of 18.
              required:
              - greaterThanYears
            hasServiceRestriction:
              type: object
              description: Check subscriber restriction settings e.g. Content Lock
              properties:
                for:
                  type: array
                  minItems: 1
                  example:
                  - adultContent
                  items:
                    type: string
                    enum:
                    - adultContent
              required:
              - for
            matchingDeviceInfo:
              type: object
              description: Confirm the connected device is as expected
              minProperties: 1
              properties:
                IMEI:
                  type: string
                  example: '969455279101647'
                  minLength: 14
                  maxLength: 15
                  description: 15-digit code that identifies a device
                  pattern: ^\d{14,15}$
                calculateCheckDigit:
                  type: boolean
                  x-stoplight:
                    id: 67cfyeta5o5q9
                  default: false
                  description: calculate check digit for 14-digit IMEI
              required:
              - IMEI
            matchingAccountInfo:
              type: object
              description: Retrieve additional information about the subscriber account
              properties:
                for:
                  type: array
                  minItems: 1
                  example:
                  - isActive
                  - contractType
                  - lostOrStolen
                  items:
                    type: string
                    enum:
                    - isActive
                    - contractType
                    - lostOrStolen
              required:
              - for
      required:
      - assure
    ProtectProductRequest:
      title: Protect Product Request
      type: object
      description: None of the features are required, but at least one must be present in the body to make a successful Protect call
      properties:
        protect:
          type: object
          description: To make a call to Protect you will need at least one of the product features below in the body
          additionalProperties: false
          minProperties: 1
          properties:
            hasSimChanged:
              oneOf:
              - additionalProperties: false
                title: inSeconds
                description: Determine if a customer or third party has swapped SIM cards in the specified time period
                properties:
                  inSeconds:
                    type: integer
                    example: 120
                    description: set look-back period in past seconds
                required:
                - inSeconds
              - additionalProperties: false
                title: inMinutes
                description: Determine if a customer or third party has swapped SIM cards in the specified time period
                properties:
                  inMinutes:
                    type: integer
                    example: 40
                    description: set look-back period in past minutes
                required:
                - inMinutes
              - additionalProperties: false
                title: inHours
                description: Determine if a customer or third party has swapped SIM cards in the specified time period
                properties:
                  inHours:
                    type: integer
                    example: 12
                    description: set look-back period in past hours
                required:
                - inHours
              - additionalProperties: false
                title: inDays
                description: Determine if a customer or third party has swapped SIM cards in the specified time period
                properties:
                  inDays:
                    type: integer
                    example: 30
                    description: set look-back period in past days
                required:
                - inDays
              - additionalProperties: false
                title: inDate
                description: Determine if a customer or third party has swapped SIM cards in the specified time period
                properties:
                  inDate:
                    type: string
                    format: date
                    example: '2021-03-01'
                    description: set look-back period to a fixed date
                required:
                - inDate
              type: object
            hasDeviceChanged:
              oneOf:
              - additionalProperties: false
                title: inSeconds
                description: Determine if the customer or a third party has changed device within the specified time period
                properties:
                  inSeconds:
                    type: integer
                    example: 120
                    description: set look-back period in past seconds
                required:
                - inSeconds
              - additionalProperties: false
                title: inMinutes
                description: Determine if the customer or a third party has changed device within the specified time period
                properties:
                  inMinutes:
                    type: integer
                    example: 40
                    description: set look-back period in past minutes
                required:
                - inMinutes
              - additionalProperties: false
                title: inHours
                description: Determine if the customer or a third party has changed device within the specified time period
                properties:
                  inHours:
                    type: integer
                    example: 12
                    description: set look-back period in past hours
                required:
                - inHours
              - additionalProperties: false
                title: inDays
                description: Determine if the customer or a third party has changed device within the specified time period
                properties:
                  inDays:
                    type: integer
                    example: 30
                    description: set look-back period in past days
                required:
                - inDays
              - additionalProperties: false
                title: inDate
                description: Determine if the customer or a third party has changed device within the specified time period
                properties:
                  inDate:
                    type: string
                    format: date
                    example: '2021-03-01'
                    description: set look-back period to a fixed date
                required:
                - inDate
              type: object
            wasReportedLostOrStolen:
              oneOf:
              - additionalProperties: false
                title: inSeconds
                description: Determine if the subscriber account had a device/SIM reported lost or stolen in the specified time period
                properties:
                  inSeconds:
                    type: integer
                    example: 120
                    description: set look-back period in past seconds
                required:
                - inSeconds
              - additionalProperties: false
                title: inMinutes
                description: Determine if the subscriber account had a device/SIM reported lost or stolen in the specified time period
                properties:
                  inMinutes:
                    type: integer
                    example: 40
                    description: set look-back period in past minutes
                required:
                - inMinutes
              - additionalProperties: false
                title: inHours
                description: Determine if the subscriber account had a device/SIM reported lost or stolen in the specified time period
                properties:
                  inHours:
                    type: integer
                    example: 12
                    description: set look-back period in past hours
                required:
                - inHours
              - additionalProperties: false
                title: inDays
                description: Determine if the subscriber account had a device/SIM reported lost or stolen in the specified time period
                properties:
                  inDays:
                    type: integer
                    example: 30
                    description: set look-back period in past days
                required:
                - inDays
              - additionalProperties: false
                title: inDate
                description: Determine if the subscriber account had a device/SIM reported lost or stolen in the specified time period
                properties:
                  inDate:
                    type: string
                    format: date
                    example: '2021-03-01'
                    description: set look-back period to a fixed date
                required:
                - inDate
              type: object
            hasAccountTenure:
              oneOf:
              - additionalProperties: false
                title: greaterThanDays
                description: Determine if a customer or a third party has held an account on network within the specified time period
                properties:
                  greaterThanDays:
                    type: integer
                    example: 30
                    description: Period of time in days
                required:
                - greaterThanDays
              - additionalProperties: false
                title: greaterThanMonths
                description: Determine if a customer or a third party has held an account on network within the specified time period
                properties:
                  greaterThanMonths:
                    type: integer
                    example: 1
                    description: Period of time in months
                required:
                - greaterThanMonths
              - additionalProperties: false
                title: greaterThanYears
                description: Determine if a customer or a third party has held an account on network within the specified time period
                properties:
                  greaterThanYears:
                    type: integer
                    example: 1
                    description: Period of time in years
                required:
                - greaterThanYears
              - additionalProperties: false
                title: greaterThanDate
                description: Determine if a customer or a third party has held an account on network within the specified time period
                properties:
                  greaterThanDate:
                    type: string
                    example: '2021-03-10'
                    description: Period of time given with an date in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations)
                required:
                - greaterThanDate
              type: object
            hasContractInfo:
              description: Retrieve additional information about the account contract
              type: object
              properties:
                for:
                  type: array
                  minItems: 1
                  example:
                  - startDate
                  default:
                  - startDate
                  items:
                    type: string
                    enum:
                    - startDate
              required:
              - for
            hasCallForwarding:
              type: object
              description: Verify if call diverts are set
              properties:
                for:
                  type: string
                  enum:
                  - unconditional
                  example: unconditional
                  default: unconditional
                  description: Type of call forwarding
              required:
              - for
            hasActiveCall:
              type: object
              minProperties: 1
              additionalProperties: false
              description: Determine if the subscriber is in an active call and further detail about that call
              properties:
                withMinimumDuration:
                  oneOf:
                  - additionalProperties: false
                    title: inSeconds
                    properties:
                      inSeconds:
                        type: integer
                        example: 120
                        description: set look-back period in past seconds
                    required:
                    - inSeconds
                  - additionalProperties: false
                    title: inMinutes
                    properties:
                      inMinutes:
                        type: integer
                        example: 40
                        description: set look-back period in past minutes
                    required:
                    - inMinutes
                  - additionalProperties: false
                    title: inHours
                    properties:
                      inHours:
                        type: integer
                        example: 12
                        description: set look-back period in past hours
                    required:
                    - inHours
                  - additionalProperties: false
                    title: inDays
                    properties:
                      inDays:
                        type: integer
                        example: 30
                        description: set look-back period in past days
                    required:
                    - inDays
                  - additionalProperties: false
                    title: inDate
                    properties:
                      inDate:
                        type: string
                        format: date
                        example: '2021-03-01'
                        description: set look-back period to a fixed date
                  type: object
                with:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  description: Optional additional datapoints to request
                  items:
                    type: string
                    enum:
                    - callDirection
                    - callDuration
                    - callingNumberWithheld
            hasDeviceInfo:
              type: object
              description: Retrieve additional information about the currently connected device
              properties:
                for:
                  type: array
                  minItems: 1
                  example:
                  - IMEI
                  - serialNo
                  - model
                  - activation
                  - purchaseDate
                  default:
                  - IMEI
                  description: list of device information to lookup e.g. IMEI
                  items:
                    type: string
                    enum:
                    - IMEI
                    - serialNo
                    - model
                    - activation
                    - purchaseDate
              required:
              - for
            wasBlacklisted:
              oneOf:
              - additionalProperties: false
                title: inSeconds
                description: 'Determine if a device has been blacklisted by GSMA within the specified time period

                  '
                properties:
                  inSeconds:
                    type: integer
                    example: 120
                    description: set look-back period in past seconds
                required:
                - inSeconds
              - additionalProperties: false
                title: inMinutes
                description: 'Determine if a device has been blacklisted by GSMA within the specified time period

                  '
                properties:
                  inMinutes:
                    type: integer
                    example: 40
                    description: set look-back period in past minutes
                required:
                - inMinutes
              - additionalProperties: false
                title: inHours
                description: 'Determine if a device has been blacklisted by GSMA within the specified time period

                  '
                properties:
                  inHours:
                    type: integer
                    example: 12
                    description: set look-back period in past hours
                required:
                - inHours
              - additionalProperties: false
                title: inDays
                description: 'Determine if a device has been blacklisted by GSMA within the specified time period

                  '
                properties:
                  inDays:
                    type: integer
                    example: 30
                    description: set look-back period in past days
                required:
                - inDays
              - additionalProperties: false
                title: inDate
                description: 'Determine if a device has been blacklisted by GSMA within the specified time period

                  '
                properties:
                  inDate:
                    type: string
                    format: date
                    example: '2021-03-01'
                    description: set look-back period to a fixed date
                required:
                - inDate
              type: object
      required:
      - protect
    NetworkBiometricProductRequest:
      type: object
      example:
        discover:
          number: '447700900604'
          hasNumberBeenRecycled:
            inSeconds: 900
          hasMVNOInfo:
            filterMVNO: true
          device:
            IMEI: '351490789456123'
            for:
            - serialNo
            - model
            - activation
            - blacklist
          hasHomeNetworkInfo:
            for:
            - roaming
        assure:
          matchingName:
            firstName: William
            lastName: Herschel
          matchingAddress:
            houseNumber: '10'
            houseName: Herschel Museum of Astronomy
            postcode: BA1 2BL
          matchingBirthDate:
            dateOfBirth: '1738-11-15'
          matchingAge:
            greaterThanYears: 18
          hasServiceRestriction:
            for:
            - adultContent
          matchingDeviceInfo:
            IMEI: '306772992380426'
          matchingAccountInfo:
            for:
            - isActive
            - contractType
            - lostOrStolen
        protect:
          hasSimChanged:
            inSeconds: 900
          hasDeviceChanged:
            inSeconds: 900
          hasAccountTenure:
            greaterThanDate: '2020-03-21'
          hasContractInfo:
            for:
            - startDate
          hasCallForwarding:
            for: unconditional
          hasActiveCall:
            withMinimumDuration:
              inSeconds: 120
            with:
            - callDirection
            - callDuration
            - callingNumberWithheld
          hasDeviceInfo:
            for:
            - IMEI
            - serialNo
            - model
            - activation
          wasReportedLostOrStolen:
            inDate: '2020-03-03'
          wasBlacklisted:
            inDate: '2023-01-24'
      description: The schema for the Network Biometrics request
      additionalProperties: false
      required:
      - discover
      properties:
        discover:
          $ref: '#/components/schemas/DiscoverProductRequest/properties/discover'
        assure:
          $ref: '#/components/schemas/AssureProductRequest/properties/assure'
        protect:
          $ref: '#/components/schemas/ProtectProductRequest/properties/protect'
    DiscoverProductResponse:
      title: Discover Product Response
      type: object
      description: 'Schema of a successful response for Discover features.

        Note: the discover.device.blacklist syntax has subtle differences from protect.wasBlacklisted, these are distinct products with different use cases."'
      additionalProperties: false
      example:
        discover:
          number:
            is: '447700900501'
            isCorrectFormat: true
            isValid: true
            country:
              name: United Kingdom of Great Britain and Northern Ireland
              code: GB
              dialCode: '44'
            onNetwork:
              MCC: '001'
              MNC: '04'
              networkName: Phronesis (H3G UK)
            isPorted: false
          hasNumberBeenRecycled:
            isRecycled: true
            changedInTimePeriod: true
            lastChange: '2022-10-20T11:36:26+00:00'
          hasMVNOInfo:
            isMVNO: true
            brand: iD mobile
            isDataAvailable: true
          hasHomeNetworkInfo:
            isRoaming: true
            isDataAvailable: true
          device:
            IMEI:
              is: '969455279101647'
            serialNo:
              value: DX3ZJ7LRKXK7
              isDataAvailable: true
            model:
              brand: Apple
              name: iPhone XR
              code: iPhone XR (A2105)
              isDataAvailable: true
            activation:
              isActivated: true
              isDataAvailable: true
              date: null
            estimatedPurchase:
              date: '2020-01-28'
              isDataAvailable: true
            blacklist:
              status: true
              isDataAvailable: true
              addEvent:
                date: '2023-01-24 08:32:08'
                by: Hutchison 3G UK
                reason: Stolen Or Lost
              removeEvent:
                date: '2023-01-24 15:32:08'
                by: Hutchison 3G UK
                reason: Found
              history:
                blacklistedCount: 30
                removedCount: 29
                operators: 2
            retail:
              currency: USD
              prices:
              - '1247'
              - '1366'
              - '1604'
              - '1842'
              storageOptions:
              - 128 GB
              - 256 GB
              - 512 GB
              - 1 TB
              releaseDate: '2021-09-01'
              isDataAvailable: true
        transaction:
          status:
            value: 0
            message: transaction successful
          reference: https://developer.api.v3.phronesis.tech/
          id: b196fe72-49f7-4888-abc2-66bc14b5ca3f
      properties:
        discover:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            number:
              type: object
              additionalProperties: false
              properties:
                is:
                  type: string
                  example: '447700900501'
                  description: Echoes the input number in [E.164](https://en.wikipedia.org/wiki/E.164) format
                isCorrectFormat:
                  type: boolean
                  description: Indicates if the subscriber's number is in correct format (true) or not (false)
                  example: true
                isValid:
                  type: boolean
                  description: Indicates if the subscriber's number is valid (true) or not (false)
                  example: true
                country:
                  type: object
                  description: Country the subscriber is registered in
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      description: Name of the country the subscriber is registered in
                      example: United Kingdom of Great Britain and Northern Ireland
                    code:
                      type: string
                      description: '[ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) code for the country the subscriber is registered in'
                      example: GB
                    dialCode:
                      type: string
                      description: Dial code for the country of registration
                      example: '44'
                  required:
                  - name
                  - code
                  - dialCode
                onNetwork:
                  type: object
                  description: Subscriber network information
                  additionalProperties: false
                  properties:
                    MCC:
                      type: string
                      description: The subscriber's [mobile country code](https://en.wikipedia.org/wiki/Mobile_country_code)
                      example: '234'
                    MNC:
                      type: string
                      description: The subscriber's [mobile network code](https://en.wikipedia.org/wiki/Mobile_country_code)
                      example: '30'
                    networkName:
                      type: string
                      description: The current network operator for the subscriber
                      example: EE UK
                  required:
                  - MCC
                  - MNC
                  - networkName
                isPorted:
                  type: boolean
                  description: "A true value indicates that a number is no longer served by the original number range owner or   \nhas been ported since this allocation where data is available to determine this from the mobile operators"
                  example: true
                wasOnNetwork:
                  type: object
                  description: Previous network, if ported
                  additionalProperties: false
                  properties:
                    MCC:
                      type: string
                      description: The prior [mobile country code](https://en.wikipedia.org/wiki/Mobile_country_code) of the MSISDN
                      example: '234'
                    MNC:
                      type: string
                      description: The prior [mobile network code](https://en.wikipedia.org/wiki/Mobile_country_code)
                      example: '15'
                    networkName:
                      type: string
                      description: The prior network operator of the MSISDN
                      example: Vodafone UK
                  required:
                  - MCC
                  - MNC
                  - networkName
            hasNumberBeenRecycled:
              oneOf:
              - additionalProperties: false
                title: Successful hasNumberBeenRecycled response
                properties:
                  isRecycled:
                    type: boolean
                    description: Indicates if the number been recycled
                    example: true
                  changedInTimePeriod:
                    type: boolean
                    description: Indicates if the state has changed in the requested time period
                    example: false
                  lastChange:
                    type: string
                    description: Date of last change, if known
                    example: '2020-03-28T13:07:12Z'
                    format: date-time
                    nullable: true
                required:
                - isRecycled
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasMVNOInfo:
              oneOf:
              - additionalProperties: false
                title: Successful hasMVNOInfo response
                properties:
                  isMVNO:
                    type: boolean
                    description: Indicates if the number is allocated to a virtual mobile network (MVNO) or not
                    example: true
                    nullable: true
                  brand:
                    type: string
                    description: The (virtual) network brand, if available
                    example: iD mobile
                    nullable: true
                  isDataAvailable:
                    type: boolean
                    example: true
                required:
                - isMVNO
                - brand
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
            hasHomeNetworkInfo:
              oneOf:
              - type: object
                additionalProperties: false
                properties:
                  isRoaming:
                    type: boolean
                    description: TRUE if the device is known to be in a roaming state
                  isDataAvailable:
                    type: boolean
                required:
                - isDataAvailable
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
            device:
              oneOf:
              - additionalProperties: false
                title: Successful discover.device response
                properties:
                  IMEI:
                    type: object
                    required:
                    - is
                    properties:
                      is:
                        type: string
                        example: '969455279101641'
                        description: Echoes the input IMEI
                  serialNo:
                    type: object
                    properties:
                      value:
                        type: string
                        example: 12A34BCD
                        description: A unique code assigned by the manufacturer to help identify an individual device
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - value
                    - isDataAvailable
                  model:
                    type: object
                    properties:
                      code:
                        type: string
                        example: iPhone XR (A2105)
                        description: Technical model name given by the manufacturer
                        nullable: true
                      name:
                        type: string
                        example: iPhone XR
                        description: Consumer model name given by the manufacturer
                        nullable: true
                      brand:
                        type: string
                        example: Apple
                        description: Name of the manufacturer / companies
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - code
                    - name
                    - brand
                    - isDataAvailable
                  activation:
                    type: object
                    properties:
                      isActivated:
                        type: boolean
                        example: true
                        description: Indicates if the phone has been activated
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                      date:
                        type: string
                        format: date-time
                        example: '2022-07-11T20:08:04+00:00'
                        description: The date that the device was activated, if known
                        nullable: true
                    required:
                    - isActivated
                    - isDataAvailable
                    - date
                  estimatedPurchase:
                    type: object
                    required:
                    - date
                    - isDataAvailable
                    properties:
                      date:
                        type: string
                        format: date
                        example: '2021-03-15'
                        description: The estimated date of purchase in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Calendar_dates) format
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                  blacklist:
                    type: object
                    properties:
                      status:
                        type: boolean
                        example: true
                        description: Indicates if the device is currently blacklisted
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                      addEvent:
                        type: object
                        required:
                        - date
                        - by
                        - reason
                        nullable: true
                        properties:
                          date:
                            type: string
                            example: '2023-01-24 08:32:08'
                            description: The most recent date the device was reported blacklisted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                            nullable: true
                          by:
                            type: string
                            example: Hutchison 3G UK
                            description: The operator or other party who last updated blacklist status
                            nullable: true
                          reason:
                            type: string
                            example: stolen or lost
                            description: The reason given for the blacklist event
                            nullable: true
                      removeEvent:
                        type: object
                        required:
                        - date
                        - by
                        - reason
                        nullable: true
                        properties:
                          date:
                            type: string
                            example: '2023-01-24 08:32:08'
                            description: The most recent date the device was remove from the blacklisted in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations) format if within specified time
                            nullable: true
                          by:
                            type: string
                            example: Hutchison 3G UK
                            description: The operator or other party who last requested the removal from the blacklist
                            nullable: true
                          reason:
                            type: string
                            example: found
                            description: The reason given for the removal from the blacklist
                            nullable: true
                      history:
                        type: object
                        required:
                        - blacklistedCount
                        - removedCount
                        - operators
                        nullable: true
                        properties:
                          blacklistedCount:
                            type: integer
                            example: 10
                            description: Number of times device has been blacklisted
                            nullable: true
                          removedCount:
                            type: integer
                            example: 2
                            description: Number of times the device has been removed from the GSMA blacklist
                            nullable: true
                          operators:
                            type: integer
                            example: 2
                            description: Number of unique operators or other parties who have blacklisted the device
                            nullable: true
                    required:
                    - status
                    - isDataAvailable
                    - addEvent
                    - removeEvent
                    - history
                  retail:
                    type: object
                    properties:
                      currency:
                        type: string
                        example: USD
                        description: Indicates the currency used for the retail price
                        nullable: true
                      prices:
                        type: array
                        example:
                        - '1247'
                        - '1366'
                        - '1604'
                        - '1842'
                        description: Array containing the various retail prices for device model releases
                      storageOptions:
                        type: array
                        example:
                        - 128 GB
                        - 256 GB
                        - 512 GB
                        - 1 TB
                        description: Array containing the device model variants
                      releaseDate:
                        type: string
                        example: '2021-09-01'
                        description: The release date for the device model
                        nullable: true
                      isDataAvailable:
                        type: boolean
                        example: true
                    required:
                    - isDataAvailable
                required:
                - IMEI
              - additionalProperties: false
                title: Feature error status
                properties:
                  status:
                    $ref: '#/components/schemas/TransactionResponse/properties/transaction/properties/status'
                required:
                - status
              type: object
      required:
      - discover
    AssureProductResponse:
