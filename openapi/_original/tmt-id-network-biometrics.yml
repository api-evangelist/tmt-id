                        description: measure of similarity, the higher the value, the more similar the strings are. The score is normalized so that 0 represents no similarities, and 100 is an exact match
                  lastName:
                    type: object
                    additionalProperties: false
                    required:
                    - isDataAvailable
                    - isMatched
                    - matchConfidence
                    properties:
