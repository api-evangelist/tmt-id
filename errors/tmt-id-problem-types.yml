format: proprietary
rfc9457: false
note: >-
  TMT ID does not use RFC 9457 application/problem+json anywhere. Two proprietary envelopes
  coexist: the older lookup family (Verify, Velocity, Live, TeleShield, Score) answers HTTP 200
  and puts a numeric `status` + `status_message` inside the result object, and Network Biometrics
  answers with a real HTTP status plus a `transaction.status` object. The numeric registry behind
  the Network Biometrics envelope is captured in full in errors/tmt-id-error-codes.yml (62 codes).
  Only two of the seven specs declare any non-2xx response at all — the other five document only
  a 200, which is the single largest contract-quality gap in this estate.
