  apis: [TMT Verify, TMT Velocity, TMT Live, TMT TeleShield, TMT Score]
  http: '200 for both success and failure'
  fields: [status, status_message]
  success: 'status: 0 / "Success"'
  observed_failure: '{"status": 4, "status_message": "Invalid request. Please check documentation, thank you"}'
  evidence: >-
    Observed live against https://api.tmtverify.com — every unrecognised path returns HTTP 200
    with that body, confirming the envelope is applied at the edge as well as in the products.
- family: Network Biometrics
  apis: [Network Biometrics]
  http: 200, 202, 400, 401, 403, 404, 405, 408, 500, 502, 503
  fields: [transaction.status.value, transaction.status.message, transaction.id, transaction.reference]
