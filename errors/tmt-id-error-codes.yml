method: searched
source: https://tmtid.com/developer/network_biometrics.html (per-response code tables, mirrored in openapi/tmt-id-network-biometrics.yml)
applies_to: Network Biometrics API (and the deprecated v2 Number Assurance operations)
envelope:
  field: transaction.status.value
  message_field: transaction.status.message
  correlation: transaction.id (server-side UUID) and the optional caller-supplied Correlation-Id header
  note: The numeric code is the authoritative outcome. The same code can arrive under different HTTP statuses depending
    on the operation (e.g. 306 unknown subscriber is 200 on the deprecated v2 operations and 404 on /network-biometrics),
    so branch on the numeric code, not on HTTP status alone.
families:
- range: 0-2
  name: success
  note: 0 = fully successful, 2 = successful but partial data returned.
- range: 100-106
  name: account & authentication
  note: Returned as HTTP 401/400/405. Terminal — a retry with the same credentials will fail identically.
- range: 200-215
  name: entitlement, throttling & request validation
  note: 200 IP not whitelisted, 201/202/203 per-second/per-day/per-month throttling (HTTP 503), 204/206 product
    not provisioned or suspended, 207-215 parameter validation, 212 MNO access not authorised (HTTP 403).
- range: 300-310
  name: per-check failure
  note: A named check inside the transaction could not be completed (call forward, SIM swap, country, user information,
    vicinity). Usually HTTP 202 — the transaction itself was accepted.
- range: 404-409
  name: subscriber / number not resolvable
  note: Opt-out, invalid number, unregistered prepay, unknown routing information, unknown number range, unsupported
    device. Terminal negative answers, not faults.
- range: 800-817
  name: data source & subsystem
  note: 'Upstream MNO/data-partner and internal subsystem conditions surfaced honestly to the caller: unavailable,
    query failed, timed out, capacity/quota exceeded, called too early, unexpected response.'
rate_limit_signalling:
  codes:
  - 201
  - 202
  - 203
  http_status: 503
  note: TMT ID publishes no numeric rate limits and returns no RateLimit/X-RateLimit headers and no HTTP 429; throttling
    is only observable through these three numeric codes under a 503. Network Biometrics test persona 447700900505
    deliberately simulates an MNO-side "Rate limit exceeded" condition.
