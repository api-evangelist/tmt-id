summary: >-
  TMT ID versions each product independently and publishes no estate-wide versioning or
  deprecation policy, no SLA document, no public status page and no dated changelog. What it does
  publish honestly is one real deprecation: the v2 Number Assurance family is marked deprecated in
  the OpenAPI itself, restricted to existing customers, and given a named successor product.
versioning:
  scheme: per-product, mixed
  policy_url: null
  current:
  - api: TMT Verify
    version: v3
    form: uri-path (POST /v3/)
  - api: Network Biometrics
    version: 1.20.0
    form: document version in info.version; the current surface is unversioned in the path
      (POST /network-biometrics)
  - api: TMT Authenticate
    version: v1 / 1.1.2
    form: uri-path on the host (https://auth-api.tmtanalysis.com/v1) plus info.version 1.1.2
  - api: TMT TeleShield
    version: v1.3 and v2.0 data dictionaries served side by side
    form: encoded in the path-parameter label ('{number v1.3}' vs '{number v2.0}') rather than in
      the route — an unusual and machine-hostile way to express a version
  - api: TMT Velocity
    version: unversioned (/standard/...)
  - api: TMT Live
    version: unversioned
  - api: TMT Score
    version: unversioned (/score/{number})
