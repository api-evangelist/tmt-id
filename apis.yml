aid: tmt-id
url: https://raw.githubusercontent.com/api-evangelist/tmt-id/refs/heads/main/apis.yml
name: TMT ID
kind: company
description: >-
  TMT ID (trading name of TMT Analysis Limited, London) is a United Kingdom mobile
  number intelligence and anti-fraud data provider that sits between the mobile network
  operators and the businesses that need to trust a phone number. Founded in 2017 as
  TMT Analysis, it acquired Phronesis Technologies in 2023 and rebranded to TMT ID in
  2024. It does not own network infrastructure; it aggregates operator, numbering-plan
  and ENUM data and resells it as real-time REST lookups — number validity and
  reachability, current network and portability, SIM-swap and device-change events,
  subscriber-data matching, risk scoring, telephony-fraud and routing intelligence, and
  silent network authentication as an alternative to SMS OTP. Its API posture is
  genuinely open by telecom standards: seven product APIs are documented publicly as
  ReDoc-rendered OpenAPI 3.0 documents at tmtid.com/developer with no login, and the
  Viteza portal offers self-serve signup with 500 free queries. Credentials for the
  production APIs are still issued through a commercial onboarding conversation rather
  than instant key generation. TMT ID states on its own site that it is a GSMA Open
  Gateway member, but it publishes no CAMARA-conformant API — its SIM-swap and
  network-authentication products ship under TMT ID's own proprietary schemas, which is
  the honest position of most of the identity-and-antifraud layer of this market.
