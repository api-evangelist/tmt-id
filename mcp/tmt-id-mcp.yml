agent_guidance:
- Every call is metered and billed. There is no idempotency contract, so a retry is a second
  chargeable query — never retry blindly on timeout.
- Use the published test personas (sandbox/tmt-id-sandbox.yml) during development; they return
  canned scenarios without hitting — or being billed by — the mobile network operator.
- Success is not the HTTP status on the lookup family; branch on the numeric status /
  transaction.status.value (errors/tmt-id-error-codes.yml).
- Throttling appears as codes 201/202/203 under HTTP 503, not as a 429.
- These APIs return personal-data MATCH signals about real people. TMT ID's own llms.txt forbids
  presenting the output as a legal, regulatory, KYC, AML or age determination.
