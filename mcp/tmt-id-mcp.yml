tools:
- name: verify_number
  description: Verify a mobile number against operator data and return the requested datapoints —
    network, portability, subscriber status, roaming, SIM swap, market segment, KYC match.
  source_operation: openapi/tmt-id-verify.yml#POST
  consequence: read
  cost: chargeable per query
- name: lookup_current_network
  description: Return the mobile network operator currently serving a number, portability-aware.
  source_operation: openapi/tmt-id-velocity.yml#GET
  consequence: read
  cost: chargeable per query
- name: check_number_live
  description: Check whether a mobile number is currently assigned and active on a network.
  source_operation: openapi/tmt-id-live.yml#GET
  consequence: read
  cost: chargeable per query
- name: score_number
  description: Return a 0-100 credibility score for a phone number.
  source_operation: openapi/tmt-id-score.yml#GET
  consequence: read
  cost: chargeable per query
- name: teleshield_routing
  description: Numbering-plan validity, allocation and service type for routing decisions.
  source_operation: openapi/tmt-id-teleshield.yml#POST (/r-teleshield/{number})
  consequence: read
  cost: chargeable per query
- name: teleshield_fraud
  description: Fraud propensity for a number range — wangiri, IRSF, CLI spoofing, origin-based
    rating abuse.
  source_operation: openapi/tmt-id-teleshield.yml#POST (/f-teleshield/{number})
  consequence: read
  cost: chargeable per query
- name: teleshield_enhanced_fraud
  description: Enhanced fraud data dictionary (v1.3 and v2.0 variants).
  source_operation: openapi/tmt-id-teleshield.yml#POST (/e-teleshield/{number v2.0})
  consequence: read
  cost: chargeable per query
- name: network_biometrics
  description: Assemble a configurable set of mobile network signals about a number and device —
    discover (validity, network, recycle, MVNO, device), assure (name/address/age/DOB/account
    matching) and protect (SIM change, device change, lost or stolen, tenure, call forwarding,
    blacklist).
  source_operation: openapi/tmt-id-network-biometrics.yml#post-network-biometrics
  consequence: read
  cost: chargeable per query; some assure features incur an additional MNO charge
  note: The discover object is required in every request; assure and protect are optional.
- name: authenticate_get_token
  description: Exchange HTTP Basic credentials for a PASETO access token.
  source_operation: openapi/tmt-id-authenticate.yml#getAccessToken
  consequence: credential exchange
- name: authenticate_get_config
  description: Learn how the relevant mobile network operator wants the authentication session
    opened.
  source_operation: openapi/tmt-id-authenticate.yml#getConfig
  consequence: read
- name: authenticate_silent
  description: Run the silent network authentication flow for a subscriber.
  source_operation: openapi/tmt-id-authenticate.yml#authenticateUserWithMNO
  consequence: acting
  note: Involves a 302 redirect through the operator; not a pure server-to-server read.
- name: authenticate_otp
  description: Fall back to a one-time-password authentication flow.
  source_operation: openapi/tmt-id-authenticate.yml#authenticateUserWithOtp
  consequence: acting
  note: Sends an OTP to a real subscriber — human-visible side effect.
- name: authenticate_validate
  description: Confirm whether the phone number was successfully authenticated in this session.
  source_operation: openapi/tmt-id-authenticate.yml#validateUserSession
