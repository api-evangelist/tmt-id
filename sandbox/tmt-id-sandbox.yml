method: searched
source: https://tmtid.com/developer/network_biometrics.html (Test Personas section, mirrored verbatim
  in openapi/tmt-id-network-biometrics.yml)
summary: 'TMT ID publishes a real test surface in two places. (1) Network Biometrics ships a published
  "Test Personas" register: 168 MSISDNs across 35 operator/aggregator groups that return canned responses
  without making a chargeable call to the mobile network operator, including personas that deliberately
  simulate SIM change, device change, number recycle, lost-or-stolen, call forwarding, roaming, MVNO filtering,
  rate-limit exceeded and subscriber-not-found errors. (2) The Viteza self-serve portal issues real keys
  with 500 free queries against Live, Velocity and TeleShield Routing. There is no separate sandbox host
  and no test-vs-live key prefix: test personas are exercised against whichever platform the account was
  granted during onboarding.'
modes:
- name: test personas
  type: magic identifiers
  host: https://ea.api.phronesis.tech or https://api.phronesis.tech
  note: Same production credentials and endpoints; the MSISDN itself selects the canned scenario. No MNO
    charge is incurred.
- name: early access platform
  type: pre-production environment
  host: https://ea.api.phronesis.tech
  note: Published in the Network Biometrics API Overview as the early-access platform running the latest
    code base; granted per account plan.
- name: authenticate staging
  type: staging environment
  host: https://auth-staging-api.tmtid.dev/v1
  note: Declared as a servers[] entry in openapi/tmt-id-authenticate.yml alongside production https://auth-api.tmtanalysis.com/v1.
- name: Viteza free tier
  type: self-serve trial
  host: https://viteza.tmtanalysis.com/register
  note: 500 free queries across Live, Velocity and TeleShield Routing on signup; pay-as-you-go thereafter.
    Keys are live keys, not test keys.
key_prefixes: null
test_clocks: null
notes:
- Event-window features (hasSimChanged, hasDeviceChanged, hasNumberBeenRecycled, wasReportedLostOrStolen,
  hasAccountTenure, wasBlacklisted) take an inSeconds/period input, so the persona scenarios are exercised
  by widening or narrowing the requested window rather than by a test clock.
- 'The persona register is published inside the OpenAPI document itself (tag: Test Personas), which is
  why it is captured verbatim in openapi/tmt-id-network-biometrics.yml.'
- Verify, Velocity, Live, Score and TeleShield publish no test numbers of their own; the Viteza 500 free
  queries are the trial path for those products.
